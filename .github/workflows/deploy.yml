name: Deploy to OCI

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # 1. 테스트 & 린트 (GitHub 호스팅 — 격리된 클린 환경)
  # ─────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24 세팅
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: uv 설치 및 Python 3.13 세팅
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치 (dev 포함)
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: 테스트 (pytest)
        run: uv run --no-sync pytest backend/tests/

      - name: 프론트엔드 테스트
        run: node --test frontend/tests/*.test.js

  # ─────────────────────────────────────────
  # 2. 빌드 & 배포 (OCI 인스턴스의 self-hosted runner에서 직접 실행)
  # ─────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드
        run: docker compose --env-file /etc/gifttax/gifttax.env build

      - name: 서비스 재시작
        run: docker compose --env-file /etc/gifttax/gifttax.env up -d --remove-orphans

      - name: 미사용 이미지 정리
        run: docker image prune -f

      - name: 헬스 체크
        run: |
          for attempt in $(seq 1 12); do
            if docker compose --env-file /etc/gifttax/gifttax.env exec -T gifttax \
              python -c 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5); assert response.status == 200; assert json.load(response)["status"] == "ok"'; then
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 failed; retrying in 5s"
            sleep 5
          done

          echo "Health check failed"
          docker compose --env-file /etc/gifttax/gifttax.env ps
          docker compose --env-file /etc/gifttax/gifttax.env logs --tail=100 gifttax nginx
          exit 1
