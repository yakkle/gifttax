name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 및 Python 3.13 세팅
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치 (dev 포함)
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: 테스트 (pytest)
        run: pytest backend/tests/
