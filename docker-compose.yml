services:
  gifttax:
    build: .
    volumes:
      - gifttax-data:/tmp/gifttax
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GIFTTAX_DATABASE_PATH=/tmp/gifttax/feedback.sqlite3
      - GIFTTAX_RETENTION_INTERVAL_SECONDS=${GIFTTAX_RETENTION_INTERVAL_SECONDS:-86400}
      - GIFTTAX_ADMIN_MODE=${GIFTTAX_ADMIN_MODE:-webauthn}
      - GIFTTAX_ADMIN_ORIGIN=${GIFTTAX_ADMIN_ORIGIN:-}
      - GIFTTAX_ADMIN_RP_ID=${GIFTTAX_ADMIN_RP_ID:-}
      - GIFTTAX_ADMIN_JWT_SECRET=${GIFTTAX_ADMIN_JWT_SECRET:-}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - letsencrypt-www:/var/www/certbot
    depends_on:
      - gifttax
    restart: unless-stopped

volumes:
  gifttax-data:
  letsencrypt-www:
