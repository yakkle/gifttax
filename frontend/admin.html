<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 인증 · GiftTax</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main>
    <a class="back" href="/">← 계산기로 돌아가기</a>
    <header><p class="eyebrow">GiftTax</p><h1>관리자 인증</h1><p>관리자 로그인과 패스키를 관리합니다.</p></header>
    <p id="message" role="status" aria-live="polite">인증 설정을 확인하고 있습니다.</p>
    <section id="login" hidden>
      <div id="passkey-login" hidden>
        <h2>패스키로 로그인</h2>
        <p>등록한 기기의 화면 잠금이나 보안 키로 인증해 주세요.</p>
        <button id="login-button" type="button">패스키로 로그인</button>
      </div>
      <form id="setup-form" hidden>
        <h2>최초 패스키 등록</h2>
        <p>서버에서 발급한 등록 코드는 10분 동안 한 번 사용할 수 있습니다.</p>
        <label for="registration-code">등록 코드</label>
        <input id="registration-code" type="password" required maxlength="256" autocomplete="off" spellcheck="false">
        <label for="setup-label">패스키 이름</label>
        <input id="setup-label" required maxlength="80" value="내 패스키" autocomplete="off">
        <button type="submit">패스키 등록 후 로그인</button>
      </form>
      <form id="token-form" hidden>
        <h2>일회용 토큰으로 로그인</h2>
        <p>수동 JWT 인증 모드입니다. 서버에서 발급한 토큰은 5분 동안 한 번 사용할 수 있습니다.</p>
        <label for="login-token">로그인 토큰</label>
        <textarea id="login-token" required maxlength="4096" autocomplete="off" spellcheck="false" rows="4"></textarea>
        <button type="submit">로그인</button>
      </form>
    </section>
    <section id="session" hidden>
      <div class="session-heading"><h2>로그인됨</h2><button id="logout-button" type="button" class="secondary">로그아웃</button></div>
      <p id="expires"></p>
      <div id="passkey-management" hidden>
        <h3>등록된 패스키</h3>
        <ul id="credentials"></ul>
        <p class="hint">마지막 패스키는 삭제할 수 없습니다. 패스키를 삭제하면 모든 기기에서 로그아웃됩니다.</p>
        <form id="add-form">
          <label for="add-label">추가할 패스키 이름</label>
          <input id="add-label" required maxlength="80" autocomplete="off" placeholder="예: 예비 보안 키">
          <button type="submit">패스키 추가</button>
        </form>
      </div>
    </section>
    <noscript>관리자 인증을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
  </main>
</body>
</html>
